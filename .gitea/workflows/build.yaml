name: Build & Publish Container

on:
  push:
    tags: ["v*"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: |
          podman run --rm --platform linux/amd64 -v "$PWD":/src:z -w /src \
            docker.io/library/golang:1.26.3-alpine \
            go test ./...

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Register QEMU for multi-arch builds
        run: podman run --rm --privileged docker.io/multiarch/qemu-user-static --reset -p yes

      - name: Set build tag
        id: tag
        run: echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Login to registry
        env:
          GITEA_TOKEN: ${{ secrets.JUDO2MQTTCI }}
        run: |
          podman login git.zk35.de -u secalpha -p ${GITEA_TOKEN}
          sudo podman login git.zk35.de -u secalpha -p ${GITEA_TOKEN}

      - name: Build and push linux/amd64
        env:
          TAG: ${{ steps.tag.outputs.value }}
          IMAGE: git.zk35.de/secalpha/judo2mqtt
        run: |
          podman build --platform linux/amd64 -t ${IMAGE}:${TAG}-amd64 .
          podman push ${IMAGE}:${TAG}-amd64

      - name: Build and push linux/arm/v7
        env:
          TAG: ${{ steps.tag.outputs.value }}
          IMAGE: git.zk35.de/secalpha/judo2mqtt
        run: |
          sudo podman build --platform linux/arm/v7 -t ${IMAGE}:${TAG}-armv7 .
          sudo podman push ${IMAGE}:${TAG}-armv7

      - name: Build and push linux/arm64
        env:
          TAG: ${{ steps.tag.outputs.value }}
          IMAGE: git.zk35.de/secalpha/judo2mqtt
        run: |
          sudo podman build --platform linux/arm64 -t ${IMAGE}:${TAG}-arm64 .
          sudo podman push ${IMAGE}:${TAG}-arm64

      - name: Create and push multi-arch manifest
        env:
          TAG: ${{ steps.tag.outputs.value }}
          IMAGE: git.zk35.de/secalpha/judo2mqtt
        run: |
          podman manifest rm ${IMAGE}:${TAG} 2>/dev/null || true
          podman manifest create ${IMAGE}:${TAG} \
            ${IMAGE}:${TAG}-amd64 \
            ${IMAGE}:${TAG}-armv7 \
            ${IMAGE}:${TAG}-arm64
          podman manifest push ${IMAGE}:${TAG}

          podman manifest rm ${IMAGE}:latest 2>/dev/null || true
          podman manifest create ${IMAGE}:latest \
            ${IMAGE}:${TAG}-amd64 \
            ${IMAGE}:${TAG}-armv7 \
            ${IMAGE}:${TAG}-arm64
          podman manifest push ${IMAGE}:latest
